	<script>
		/* Thème et animations posés avant le premier rendu (pas d'éclair du mauvais thème) ; cf. web/src/ui/preferences.ts. */
		( function () {
			var r = document.documentElement, t = null, m = null;
			try { t = localStorage.getItem( 'atom:theme' ); m = localStorage.getItem( 'atom:mouvement' ); } catch ( e ) {}
			if ( t !== 'light' && t !== 'dark' ) t = window.matchMedia && matchMedia( '(prefers-color-scheme: dark)' ).matches ? 'dark' : 'light';
			r.setAttribute( 'data-theme', t );
			r.style.colorScheme = t;
			if ( m === 'reduit' || ( window.matchMedia && matchMedia( '(prefers-reduced-motion: reduce)' ).matches ) ) r.setAttribute( 'data-motion', 'reduit' );
		} )();
	</script>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
